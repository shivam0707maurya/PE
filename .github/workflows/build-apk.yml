name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper jar..."
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for easy identification
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PE-Shop-Printer.apk
          echo "Built APK size:"
          ls -lh output/PE-Shop-Printer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PE-Shop-Printer-APK
          path: output/PE-Shop-Printer.apk
          retention-days: 30

      - name: Create GitHub Release (on main or workflow_dispatch)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PE App v1.0.0 (Release Build)"
          body: |
            ## PE - Pooja Enterprises LAN Thermal Bill Printer App
            
            ### How to install:
            1. Download `PE-Shop-Printer.apk` below directly to your Android phone.
            2. Tap the downloaded file to install.
            3. If prompted, allow "Install from Unknown Sources".
            4. Connect to shop Wi-Fi and print!
          files: output/PE-Shop-Printer.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
